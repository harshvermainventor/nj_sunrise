name: Build Free Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Android debug keystore for seamless APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: avcrm-debug-keystore-v1

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/cli@^8.0.0 @capacitor/android@^8.0.0
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure persistent storage permissions, app icons, and update versionCode
        run: |
          python3 - <<'PYEOF'
          import os, re, shutil

          # 1. Ensure AndroidManifest.xml allows Documents storage across Android versions and retains backup
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
            with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = f.read()
            perms = [
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
            ]
            for perm in perms:
              if perm.split('"')[1] not in manifest:
                manifest = manifest.replace('<application', f'    {perm}\n    <application', 1)
            with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(manifest)

          # 2. Bump versionCode using GitHub Actions run_number so newer builds update cleanly in-place
          gradle_path = 'android/app/build.gradle'
          run_num = os.environ.get('GITHUB_RUN_NUMBER', '1')
          if os.path.exists(gradle_path):
            with open(gradle_path, 'r', encoding='utf-8') as f:
              gradle = f.read()
            gradle = re.sub(r'versionCode\s+\d+', f'versionCode {run_num}', gradle, count=1)
            gradle = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', gradle, count=1)
            with open(gradle_path, 'w', encoding='utf-8') as f:
              f.write(gradle)

          # 3. Copy app launcher icon into mipmap folders if available
          src_icon = 'public/pwa-512x512.png'
          if os.path.exists(src_icon):
            for density in ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              res_dir = f'android/app/src/main/res/mipmap-{density}'
              if os.path.isdir(res_dir):
                for target in ['ic_launcher.png', 'ic_launcher_round.png']:
                  shutil.copyfile(src_icon, os.path.join(res_dir, target))
          PYEOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Apartment Visitor CRM APK
        uses: actions/upload-artifact@v4
        with:
          name: apartment-visitor-crm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
